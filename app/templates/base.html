<!doctype html>
<html data-theme="{{ 'light' if tenant.theme == 'custom' else (tenant.theme or 'dim') }}" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="/manifest.json">
        <link rel="icon" href="/favicon.ico">
        <title>{% block title %}Gyme{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />
        
        {% if tenant.theme == 'custom' and tenant.brand_colors %}
        <style>
        :root {
            /* These will only be used if the data-theme is 'custom' */
            --color-primary: {{ tenant.brand_colors.primary }};
            --color-primary-content: {{ tenant.brand_colors.primary_content or '#ffffff' }};
            --color-secondary: {{ tenant.brand_colors.secondary }};
            --color-accent: {{ tenant.brand_colors.accent }};
            --color-neutral: {{ tenant.brand_colors.neutral }};
            --color-base-100: {{ tenant.brand_colors.base_100 }};
        }
        </style>
        {% endif %}
    </head>
    
    <body class="bg-base-200 font-sans! antialiased" hx-boost="true"> 
        
        <div class="mx-auto w-full max-w-150 min-h-screen bg-base-100 shadow-2xl">
            
            <div id="top-progress-bar" class="fixed top-0 h-0.5 bg-primary z-[9999] transition-all duration-300 ease-out w-0 opacity-0 drop-shadow-md pointer-events-none max-w-150 mx-auto"></div>
            
            <main id="main-content" class="px-4">
                {% block content %}{% endblock %}
                
                <div id="modal-container"></div>
                <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>
            </main>

        </div>
        
        <script type="module" src="{{ url_for('static', path='/app.js') }}"></script>
        
        <script>
            // Helper function to ALWAYS get the fresh element from the current DOM
            function getProgressBar() {
                return document.getElementById("top-progress-bar");
            }

            function startProgress() {
                const bar = getProgressBar();
                if (!bar) return; // Safety check
                
                bar.style.transition = 'width 0.3s ease-out, opacity 0.1s ease-in';
                bar.style.opacity = '1';
                bar.style.width = '30%'; 
                
                // Fake progress while waiting for the server
                setTimeout(() => { 
                    if(bar.style.opacity === '1') bar.style.width = '70%'; 
                }, 400);
            }

            function stopProgress() {
                const bar = getProgressBar();
                if (!bar) return; // Safety check
                
                bar.style.transition = 'width 0.2s ease-out, opacity 0.3s ease-out';
                bar.style.width = '100%'; // Snap to finish
                
                // Fade out and reset
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => { 
                        bar.style.transition = 'none'; // Turn off transition for reset
                        bar.style.width = '0%'; 
                    }, 300); 
                }, 300);
            }

            // 🟢 Attach to 'document' instead of 'document.body' so they survive page swaps!
            document.addEventListener('htmx:beforeRequest', startProgress);
            document.addEventListener('htmx:afterSettle', stopProgress);

            // Catch native browser reloads (e.g., F5 or clicking 'Refresh')
            window.addEventListener('beforeunload', startProgress);

            // Play a quick completion animation when a cold page first loads
            document.addEventListener("DOMContentLoaded", stopProgress);
        </script>
    </body>
</html>
