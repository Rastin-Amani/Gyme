<!doctype html>
<html data-theme="light" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Gyme{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />
    </head>
    <!-- hx-boost="true" makes all internal links act like an SPA -->
    <body class="bg-base-200 font-sans" hx-boost="true">
        <div class="mx-auto w-full max-w-150 min-h-screen bg-base-100 shadow-2xl">
            <!-- This container will be updated by HTMX -->
            <main id="main-content" class="px-4">{% block content %}{% endblock %}</main>
            <div id="modal-container"></div>
        </div>
        <script type="module" src="{{ url_for('static', path='/app.js') }}"></script>
    </body>
</html>
