<!-- Backdrop -->
<!-- We use 'modal-open' so it opens immediately when HTMX injects it -->
<dialog
    id="item-modal"
    class="modal modal-bottom sm:modal-middle modal-open"
    hx-boost="false"
>
    <div class="modal-box max-h-[85vh] overflow-y-auto rounded-t-box border border-base-300 bg-base-100 pb-8 sm:rounded-box">
        <!-- Drag Handle (Visible only on mobile) -->
        <div class="mx-auto mb-5 h-1.5 w-10 rounded-full bg-base-content/20 sm:hidden"></div>

        <!-- Modal Title -->
        <h3 class="mb-5 text-xl font-semibold tracking-tight">{% block modal_title %}{% endblock %}</h3>

        <!-- Modal Body -->
        <div>
            {% block modal_body %}
                <!-- Your form goes here. Example: -->
                <form hx-put="/items/{{ item.id }}" hx-swap="none" class="flex flex-col gap-4">
                    <!-- Form Fields -->

                    <!-- Action Buttons -->
                    <div class="mt-6 flex items-center justify-between gap-3">
                        <button type="submit" class="btn btn-primary flex-1">
                            {{ _('Save changes') }}
                        </button>

                        <!-- Cancel button simply removes the modal from the DOM -->
                        <button
                            type="button"
                            class="btn btn-ghost"
                            hx-on:click="document.getElementById('item-modal').remove()"
                        >
                            {{ _('Cancel') }}
                        </button>
                    </div>
                </form>
            {% endblock %}
        </div>
    </div>

    <!-- Backdrop: Clicking outside the modal removes it safely without using nested forms -->
    <div
        class="modal-backdrop bg-base-content/30 backdrop-blur-sm cursor-pointer"
        hx-on:click="document.getElementById('item-modal').remove()"
        hx-boost="false"
    ></div>
</dialog>
