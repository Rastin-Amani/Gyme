{% set phone_name = phone_name | default("phone") %}
{% set phone_label = phone_label | default(_("Phone number")) %}
{% set phone_value = phone_value | default("") %}
{% set phone_required = phone_required | default("required") %}

<div class="w-full" x-data="phoneField('{{ phone_value }}')">
    <span class="label mb-1 block text-base-content/70">{{ phone_label }}</span>
    <div class="input w-full">
        <select
            class="select select-ghost w-28 shrink-0 tabular-nums"
            aria-label="{{ _('Country code') }}"
            x-model="dialCode"
            @change="sync()"
            {{ phone_required }}
        >
            <template x-for="c in countries" :key="c.dial + c.name">
                <option :value="'+' + c.dial" x-text="c.flag + ' +' + c.dial"></option>
            </template>
        </select>
        <input
            type="tel"
            inputmode="numeric"
            autocomplete="tel-national"
            class="w-full bg-transparent tabular-nums outline-none"
            placeholder="{{ _('Phone number') }}"
            x-model="nationalNumber"
            @input="onNationalInput($event)"
            {{ phone_required }}
        />
    </div>
    <input type="hidden" name="{{ phone_name }}" x-model="phone" value="{{ phone_value }}" />
</div>
