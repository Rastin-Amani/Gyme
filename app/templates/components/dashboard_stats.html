<div class="w-full">
    <h2 class="text-sm font-bold opacity-50 mb-4">شاگردان 👥</h2>
    <div class="stats stats-vertical lg:stats-horizontal border border-base-300 bg-base-200 w-full">
        <div class="stat">
            <div class="stat-figure text-success w-6">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    class="inline-block h-8 w-8 stroke-current"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
                    ></path>
                </svg>
            </div>
            <div class="stat-title">شاگردهای فعال</div>
            <div class="stat-value text-success">{{ stats.active_trainees }}</div>
        </div>

        <div class="stat">
            <div class="stat-figure text-base-content/30 w-6">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    class="inline-block h-8 w-8 stroke-current"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    ></path>
                </svg>
            </div>
            <div class="stat-title">شاگردهای غیرفعال</div>
            <div class="stat-value text-base-content/50">{{ stats.inactive_trainees }}</div>
        </div>
    </div>
</div>

<div class="w-full">
    <h2 class="text-sm font-bold opacity-50 mb-4">برنامه‌های ثبت شده 📋</h2>
    <div class="stats stats-vertical border border-base-300 bg-base-200 w-full">
        <div class="stat">
            <div class="stat-figure text-primary text-2xl">💪🏻</div>
            <div class="stat-title">تمرینی</div>
            <div class="stat-value">{{ stats.training_plans }}</div>
        </div>

        <div class="stat">
            <div class="stat-figure text-secondary text-2xl">🥑</div>
            <div class="stat-title">غذایی</div>
            <div class="stat-value">{{ stats.diet_plans }}</div>
        </div>

        <div class="stat">
            <div class="stat-figure text-accent text-2xl">💊</div>
            <div class="stat-title">استروئیدی</div>
            <div class="stat-value">{{ stats.steroid_plans }}</div>
        </div>
    </div>
</div>
