{% extends "layouts/dashboard.html" %}

{% block dashboard_content %}
    <div class="bg-base-100 pb-24">
        <div class="flex flex-col gap-3 mb-8">
            <h1 class="font-display text-3xl font-normal leading-tight">
                {{ _('آمار کلی') }} <span class="text-2xl">📊</span>
            </h1>

            <select
                name="timeframe"
                class="select w-full sm:w-56"
                aria-label="{{ _('بازه زمانی') }}"
                hx-get="/dashboard"
                hx-target="#dashboard-content"
                hx-swap="outerHTML"
            >
                <option value="all" {% if timeframe == 'all' %}selected{% endif %}>
                    {{ _('همه زمان‌ها') }}
                </option>
                <option value="month" {% if timeframe == 'month' %}selected{% endif %}>
                    {{ _('این ماه') }}
                </option>
                <option value="week" {% if timeframe == 'week' %}selected{% endif %}>
                    {{ _('این هفته') }}
                </option>
            </select>
        </div>

        {% include "components/dashboard_content.html" %}
    </div>
{% endblock %}
