{% extends "layouts/dashboard.html" %}

{% block dashboard_content %}
    <div class="bg-base-100 pb-24" data-page-title="{{ title }}">
        <div class="flex flex-col gap-4 mb-7">
            <div class="flex items-center gap-3 flex-wrap">
                <h1 class="font-display text-3xl font-normal leading-tight">
                    {{ _('Overall statistics') }}
                </h1>
                <span class="seal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                    </svg>
                    {{ _('Gym pulse') }}
                </span>
            </div>

            <select
                name="timeframe"
                class="select w-full sm:w-56"
                aria-label="{{ _('Time period') }}"
                hx-get="/dashboard"
                hx-target="#dashboard-content"
                hx-swap="outerHTML"
                hx-sync="closest form:replace"
                hx-indicator="#dashboard-content"
            >
                <option value="all" {% if timeframe == 'all' %}selected{% endif %}>
                    {{ _('All time') }}
                </option>
                <option value="month" {% if timeframe == 'month' %}selected{% endif %}>
                    {{ _('This month') }}
                </option>
                <option value="week" {% if timeframe == 'week' %}selected{% endif %}>
                    {{ _('This week') }}
                </option>
            </select>
        </div>

        {% include "components/dashboard_content.html" %}
    </div>
{% endblock %}
