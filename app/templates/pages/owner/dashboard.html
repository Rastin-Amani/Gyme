{% extends "layouts/dashboard.html" %}

{% block dashboard_content %}
    <div class="bg-base-100 pb-24" data-page-title="{{ title }}">
        <div class="page-head">
            <div>
                <h1>{{ _('Overall statistics') }}</h1>
                <p class="page-sub">{{ _('Live count') }}</p>
            </div>

            <select
                name="timeframe"
                class="select w-full sm:w-56"
                aria-label="{{ _('Time period') }}"
                hx-get="/dashboard"
                hx-target="#dashboard-content"
                hx-swap="outerHTML"
                hx-sync="closest form:replace"
                hx-indicator="#dashboard-content"
            >
                <option value="all" {% if timeframe == 'all' %}selected{% endif %}>
                    {{ _('All time') }}
                </option>
                <option value="month" {% if timeframe == 'month' %}selected{% endif %}>
                    {{ _('This month') }}
                </option>
                <option value="week" {% if timeframe == 'week' %}selected{% endif %}>
                    {{ _('This week') }}
                </option>
            </select>
        </div>

        {% include "components/dashboard_content.html" %}
    </div>
{% endblock %}
