{% extends "layouts/dashboard.html" %}
{% block dashboard_content %}
    <div class="max-w-md mx-auto mt-12">
        <h1 class="text-2xl font-bold mb-6">پنل کاربری {{ tenant.name }}</h1>

        {% if error %}
            <div class="mb-4 p-3 rounded bg-red-100 text-red-700">{{ error }}</div>
        {% endif %}

        <!-- app/templates/pages/login.html -->
        <form method="post" action="/login">
            <!-- Hidden input to keep identity if login fails -->
            <div class="flex flex-col gap-4">
                <div>
                    <label class="floating-label">
                        <span>ایمیل</span>
                        <input
                            name="identity"
                            class="input input-bordered w-full validator"
                            placeholder="ایمیل"
                            required
                        />
                        <div class="validator-hint hidden">این فیلد اجباریه.</div>
                    </label>
                </div>
                <div>
                    <label class="floating-label">
                        <span>پسورد</span>
                        <input
                            name="password"
                            class="input input-bordered w-full validator"
                            placeholder="پسورد"
                            type="password"
                            required
                        />
                        <div class="validator-hint hidden">این فیلد اجباریه.</div>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-full">ورود</button>
            </div>
        </form>
    </div>
{% endblock %}
