{% extends "layouts/dashboard.html" %}

{% block title %}{{ _('Change password') }}{% endblock %}

{% block dashboard_content %}
    <div class="max-w-md mx-auto mt-12">
        <h1 class="font-display font-normal text-3xl leading-tight mb-8">{{ _('Change password') }}</h1>
        <form hx-post="/change-password" hx-swap="none" class="flex flex-col gap-4">
            <div class="relative w-full">
                <label class="floating-label w-full">
                    <span>{{ _('Current password') }}</span>
                    <input
                        name="old_password"
                        class="input w-full pl-12 validator"
                        placeholder="{{ _('Current password') }}"
                        type="password"
                        required
                    />
                    <div class="validator-hint hidden">{{ _('This field is required.') }}</div>
                </label>
                <button
                    type="button"
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-secondary transition-colors z-10"
                    onclick="togglePassword(this)"
                >
                    <svg
                        class="eye-open w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                        />
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                    </svg>
                    <svg
                        class="eye-closed w-5 h-5 hidden"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                        />
                    </svg>
                </button>
            </div>

            <div class="divider my-2 hidden"></div>

            <div class="relative w-full">
                <label class="floating-label w-full">
                    <span>{{ _('New password') }}</span>
                    <input
                        name="new_password"
                        class="input w-full pl-12 validator"
                        placeholder="{{ _('New password') }}"
                        type="password"
                        minlength="8"
                        required
                    />
                    <div class="validator-hint hidden">
                        {{ _('Enter at least 8 characters.') }}
                    </div>
                </label>
                <button
                    type="button"
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-secondary transition-colors z-10"
                    onclick="togglePassword(this)"
                >
                    <svg
                        class="eye-open w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                        />
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                    </svg>
                    <svg
                        class="eye-closed w-5 h-5 hidden"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                        />
                    </svg>
                </button>
            </div>

            <div class="relative w-full">
                <label class="floating-label w-full">
                    <span>{{ _('Confirm new password') }}</span>
                    <input
                        name="confirm_password"
                        class="input w-full pl-12 validator"
                        placeholder="{{ _('Confirm new password') }}"
                        type="password"
                        minlength="8"
                        required
                    />
                    <div class="validator-hint hidden">
                        {{ _('Enter at least 8 characters.') }}
                    </div>
                </label>
                <button
                    type="button"
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-secondary transition-colors z-10"
                    onclick="togglePassword(this)"
                >
                    <svg
                        class="eye-open w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                        />
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                    </svg>
                    <svg
                        class="eye-closed w-5 h-5 hidden"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                        />
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-2 border-2 border-base-content">
                {{ _('Save changes') }}
                <span class="htmx-indicator loading loading-spinner loading-sm"></span>
            </button>
        </form>
    </div>

    <script>
        function togglePassword(button) {
            // Find the input element within the same relative wrapper
            const input = button.parentElement.querySelector('input');
            const eyeOpen = button.querySelector('.eye-open');
            const eyeClosed = button.querySelector('.eye-closed');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        }
    </script>
{% endblock %}
