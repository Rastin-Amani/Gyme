<dialog id="delete-confirmation-modal" class="modal modal-bottom sm:modal-middle modal-open" hx-boost="false">
    <div class="modal-box rounded-t-box border border-base-300 bg-base-100 sm:rounded-box">
        <h3 class="text-xl font-semibold tracking-tight">{{ title }}</h3>
        <p class="mt-2 text-sm text-base-content/60">{{ _('Are you sure? This action cannot be undone.') }}</p>
        <div class="modal-action flex justify-end gap-2">
            <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').remove()">
                {{ _('Cancel') }}
            </button>
            <form
                id="delete-form"
                hx-delete="{{ delete_url }}"
                hx-swap="none"
                hx-boost="false"
                hx-on::after-request="this.closest('dialog').remove()"
            >
                <button type="submit" class="btn btn-error" hx-disabled-elt="this">
                    {{ _('Delete') }}
                </button>
            </form>
        </div>
    </div>
    <div class="modal-backdrop bg-base-content/30 backdrop-blur-sm cursor-pointer" onclick="this.closest('dialog').remove()"></div>
</dialog>
