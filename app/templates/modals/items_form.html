{% extends "layouts/modal.html" %}

{% block modal_body %}
    <form
        hx-post="{{ '/items/' + item.id if item else '/items' }}"
        hx-boost="false"
        hx-swap="none"
        hx-on:htmx:after-request="if(event.detail.successful) {
                    console.log('modal success, triggering refresh');
                    document.getElementById('modal-container').innerHTML = '';
                    htmx.trigger(document.body, 'performListRefresh');
                    }"
        class="flex flex-col gap-4 text-right"
        dir="rtl"
    >
        {% if plan_type == 'training' %}
            <div class="form-control w-full">
                <label class="floating-label">
                    <span>نام حرکت</span>
                    <input
                        type="text"
                        name="item_name"
                        value="{{ item.name or '' }}"
                        placeholder="نام حرکت"
                        class="input input-bordered w-full validator"
                        required
                    />
                    <div class="validator-hint hidden">این فیلد اجباریه.</div>
                </label>
            </div>

            <!-- Grid 3 for compact mobile view -->
            <div class="grid grid-cols-3 gap-4">
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">روز</span>
                        <input
                            type="number"
                            name="seq"
                            value="{{ item.seq or 1 }}"
                            class="input input-bordered w-full"
                        />
                        <div class="validator-hint hidden">این فیلد اجباریه.</div>
                    </label>
                </div>
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">ترتیب</span>
                        <input
                            type="number"
                            name="order"
                            value="{{ item.order or 1 }}"
                            class="input input-bordered w-full"
                        />
                    </label>
                </div>
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">ست</span>
                        <input
                            type="number"
                            name="sets"
                            value="{{ item.sets or '' }}"
                            class="input input-bordered w-full"
                        />
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">تکرار</span>
                        <input
                            type="number"
                            name="reps"
                            value="{{ item.reps or '' }}"
                            class="input input-bordered w-full"
                        />
                    </label>
                </div>
                <div class="form-control">
                    <label class="floating-label"><span class="label-text">وزنه</span></label>
                    <input
                        type="number"
                        step="0.1"
                        name="weight"
                        value="{{ item.weight or '' }}"
                        class="input input-bordered w-full"
                    />
                </div>
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">استراحت (s)</span>
                        <input
                            type="number"
                            name="rest_seconds"
                            value="{{ item.rest_seconds or '' }}"
                            class="input input-bordered w-full"
                        />
                    </label>
                </div>
            </div>
        {% elif plan_type == 'diet' %}
            <div class="form-control w-full">
                <label class="floating-label">
                    <span class="label-text">نام وعده (صبحانه...)</span>
                    <input
                        type="text"
                        name="meal_name"
                        value="{{ item.meal_name or '' }}"
                        class="input input-bordered w-full"
                    />
                </label>
            </div>
            <div class="form-control w-full">
                <label class="floating-label">
                    <span class="label-text">نام غذا</span>
                    <input
                        type="text"
                        name="food_name"
                        value="{{ item.food_name or '' }}"
                        class="input input-bordered w-full"
                    />
                </label>
            </div>
            <div class="form-control w-full">
                <label class="floating-label">
                    <span class="label-text">مقدار / واحد</span>
                    <input
                        type="text"
                        name="quantity"
                        value="{{ item.quantity or '' }}"
                        class="input input-bordered w-full"
                    />
                </label>
            </div>
        {% elif plan_type == 'steroid' %}
            <div class="form-control w-full">
                <label class="floating-label">
                    <span class="label-text">نام مکمل/دارو</span>
                    <input
                        type="text"
                        name="name"
                        value="{{ item.name or '' }}"
                        class="input input-bordered w-full"
                    />
                </label>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="form-control">
                    <label class="floating-label"><span class="label-text">نوع</span></label>
                    <select name="type" class="select select-bordered w-full">
                        <option
                            value="supplement"
                            {% if item.type == 'supplement' %}selected{% endif %}
                        >
                            مکمل
                        </option>
                        <option value="steroid" {% if item.type == 'steroid' %}selected{% endif %}>
                            استروئید
                        </option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="floating-label">
                        <span class="label-text">دوز</span>
                        <input
                            type="text"
                            name="dosage"
                            value="{{ item.dosage or '' }}"
                            class="input input-bordered w-full"
                        />
                    </label>
                </div>
            </div>
            <div class="form-control w-full">
                <label class="floating-label">
                    <span class="label-text">زمان/تکرار مصرف</span>
                    <input
                        type="text"
                        name="frequency"
                        value="{{ item.frequency or '' }}"
                        class="input input-bordered w-full"
                    />
                </label>
            </div>
        {% endif %}

        <div class="form-control w-full mt-2 flex flex-col">
            <label class="floating-label"><span class="label-text">توضیحات اضافی</span></label>
            <textarea name="notes" class="textarea textarea-bordered h-20 w-full">
                {{ item.notes or '' }}</textarea
            >
        </div>

        <div class="hidden">
            <input type="hidden" name="plan_type" value="{{ plan_type }}" />
            <!-- Pass the original plan ID so the relation doesn't break -->
            <input type="hidden" name="plan" value="{{ plan_id }}" />
        </div>

        <div class="modal-action flex flex-row-reverse gap-3 mt-6">
            <button
                type="button"
                class="btn btn-ghost flex-1"
                onclick="document.getElementById('modal-container').innerHTML = ''"
            >
                لغو
            </button>
            <button type="submit" class="btn btn-primary flex-3">
                <span class="text-center"></span>
                {% if item %}بروزرسانی{% else %}افزودن به لیست{% endif %}
            </button>
        </div>
    </form>
{% endblock %}
