services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: production
      PB_URL: ${PB_URL:?Set PB_URL to the PocketBase URL}
      # FastAPI sees the internal service Host; TenantMiddleware separately
      # validates/resolves the public X-Forwarded-Host.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-},backend"
      TRUSTED_PROXIES: 172.28.0.2/32
    networks:
      - app
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      HOST: 0.0.0.0
      PORT: "3000"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
    networks:
      app:
        ipv4_address: 172.28.0.2
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24
