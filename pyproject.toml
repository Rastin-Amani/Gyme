[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
# One-off data migration utility (not part of the app or test suite)
extend-exclude = ["translate_exercises.py"]

[tool.ruff.lint]
# Conservative, enforceable gate: pycodestyle errors + Pyflakes
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Make the `app` package importable for bare `pytest -q` (CI, make test)
pythonpath = ["."]
